<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="マルバツ記録">
<title>マルバツ記録</title>
<style>
  :root {
    --bg: #EEF1F4; --panel: #fff; --ink: #1B2430; --sub: #6B7785; --line: #D8DEE5;
    --o: #0E8A8C; --o-soft: #E1F3F3; --x: #C2334D; --x-soft: #FBE6EA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    padding: 20px 12px 40px; display: flex; justify-content: center;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { width: 100%; max-width: 560px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding: 0 4px; }
  h1 { font-size: 20px; margin: 0; }
  button { font-family: inherit; touch-action: manipulation; }
  .ghost { background: none; border: none; color: var(--sub); font-size: 13px; padding: 6px; cursor: pointer; text-decoration: underline; }
  .panel { background: var(--panel); border-radius: 14px; border: 1px solid var(--line); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 8px; padding: 12px; }
  .row + .row { border-top: 1px solid var(--line); }
  .name-col { flex: 1; min-width: 0; }
  .name { width: 100%; border: none; border-bottom: 1px dashed var(--line); background: transparent; font-size: 16px; font-weight: 600; color: var(--ink); padding: 4px 0; outline: none; font-family: inherit; border-radius: 0; }
  .name:focus { border-bottom-color: var(--ink); }
  .meta { display: flex; gap: 12px; margin-top: 4px; }
  .link { background: none; border: none; padding: 2px 0; font-size: 12px; color: var(--sub); cursor: pointer; }
  .link:disabled { opacity: .4; cursor: default; }
  .tally { width: 58px; height: 58px; border: none; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
  .tally:active { transform: scale(.94); }
  .tally.o { background: var(--o-soft); color: var(--o); }
  .tally.x { background: var(--x-soft); color: var(--x); }
  .mark { font-size: 18px; font-weight: 700; }
  .count { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pct { width: 56px; text-align: right; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .pct small { font-size: 13px; font-weight: 600; margin-left: 1px; color: var(--sub); }
  .pct .none { color: var(--sub); }
  .add { margin-top: 12px; width: 100%; padding: 14px 0; border: 1.5px dashed var(--sub); border-radius: 12px; background: transparent; color: var(--ink); font-size: 15px; cursor: pointer; }
  .total { text-align: center; font-size: 13px; color: var(--sub); margin-top: 16px; }
  .error { text-align: center; font-size: 13px; color: var(--x); margin-top: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>マルバツ記録</h1>
    <button class="ghost" id="resetAll">カウントを全消去</button>
  </header>
  <div class="panel" id="list"></div>
  <button class="add" id="addRow">＋ 項目を追加</button>
  <p class="total" id="total" hidden></p>
  <p class="error" id="error" hidden>保存できませんでした。ブラウザのプライベートモードや保存設定を確認してください。</p>
</div>

<script>
(function () {
  var KEY = "tally-rows";
  var rows = [];

  function newRow(n) {
    return { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: "項目" + n, o: 0, x: 0, last: null };
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      var data = raw ? JSON.parse(raw) : null;
      if (Array.isArray(data) && data.length) return data;
    } catch (e) {}
    return [newRow(1)];
  }

  function save() {
    var ok = true;
    try { localStorage.setItem(KEY, JSON.stringify(rows)); } catch (e) { ok = false; }
    document.getElementById("error").hidden = ok;
  }

  function find(id) { return rows.filter(function (r) { return r.id === id; })[0]; }

  function render() {
    var list = document.getElementById("list");
    list.innerHTML = "";
    rows.forEach(function (r) {
      var total = r.o + r.x;
      var pct = total === 0 ? null : Math.round(r.o / total * 100);
      var el = document.createElement("div");
      el.className = "row";
      el.innerHTML =
        '<div class="name-col">' +
          '<input class="name" aria-label="項目名">' +
          '<div class="meta">' +
            '<button class="link" data-act="undo"' + (r.last ? "" : " disabled") + '>1つ戻す</button>' +
            '<button class="link" data-act="del">削除</button>' +
          '</div>' +
        '</div>' +
        '<button class="tally o" data-act="o"><span class="mark">○</span><span class="count">' + r.o + '</span></button>' +
        '<button class="tally x" data-act="x"><span class="mark">×</span><span class="count">' + r.x + '</span></button>' +
        '<div class="pct">' + (pct === null ? '<span class="none">–</span>' : pct + '<small>%</small>') + '</div>';
      var input = el.querySelector(".name");
      input.value = r.name;
      input.addEventListener("input", function () { r.name = input.value; save(); });
      el.addEventListener("click", function (e) {
        var btn = e.target.closest("button[data-act]");
        if (!btn) return;
        var act = btn.getAttribute("data-act");
        if (act === "o" || act === "x") { r[act] += 1; r.last = act; }
        else if (act === "undo" && r.last) { r[r.last] -= 1; r.last = null; }
        else if (act === "del") {
          if (r.o + r.x > 0 && !confirm("「" + r.name + "」を削除しますか？")) return;
          rows = rows.filter(function (x) { return x.id !== r.id; });
        }
        save(); render();
      });
      list.appendChild(el);
    });

    var to = rows.reduce(function (a, r) { return a + r.o; }, 0);
    var tx = rows.reduce(function (a, r) { return a + r.x; }, 0);
    var t = document.getElementById("total");
    if (to + tx > 0) {
      t.hidden = false;
      t.textContent = "全体：○ " + to + " / × " + tx + "（" + Math.round(to / (to + tx) * 100) + "%）";
    } else {
      t.hidden = true;
    }
  }

  document.getElementById("addRow").addEventListener("click", function () {
    rows.push(newRow(rows.length + 1));
    save(); render();
  });

  document.getElementById("resetAll").addEventListener("click", function () {
    if (!confirm("すべてのカウントを0に戻しますか？（項目名は残ります）")) return;
    rows.forEach(function (r) { r.o = 0; r.x = 0; r.last = null; });
    save(); render();
  });

  rows = load();
  render();
})();
</script>
</body>
</html>
